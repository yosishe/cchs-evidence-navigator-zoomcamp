[project]
name = "cchs-evidence-navigator"
version = "0.1.0"
description = "Source-grounded CCHS literature evidence navigation for LLM Zoomcamp 2026"
requires-python = ">=3.12,<3.15"
dependencies = [
  "dlt[duckdb]>=1.0,<2",
  "minsearch>=0.1.0,<0.2",
  "openai>=2.40.0,<3",
  "psycopg[binary]>=3.3.4,<4",
  "requests>=2.28.1,<3",
  "streamlit>=1.58.0,<2",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
]

[project.optional-dependencies]
vectors = ["sentence-transformers>=5.5.0,<6"]

# Bounds follow the course or project compatibility constraints. uv.lock records
# exact resolved dependencies; these bounds alone are not an environment lock.
